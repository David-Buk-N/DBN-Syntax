{% extends 'base.html' %}

{% block title %}Login - Mind Link{% endblock %}

{% block content %}
<section class="section" style="max-width: 500px; margin: 0 auto;">
    <div class="container">
        <div class="feature-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; box-shadow: 0 10px 30px var(--shadow); border-radius: 20px; padding: 2.5rem 2rem;">
            <h2 style="text-align:center; margin-bottom: 1.5rem;">Login</h2>
            <form method="POST" action="{{ url_for('auth.login') }}" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div>
                    <label for="email" style="font-weight: 500; margin-bottom: 0.5rem; display: block;">Email</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
                </div>
                <div>
                    <label for="password" style="font-weight: 500; margin-bottom: 0.5rem; display: block;">Password</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
                </div>
                <button type="submit" style="background: var(--primary-color); color: white; padding: 0.9rem 0; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: all 0.3s ease;">Login</button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-muted);">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #fff; text-decoration: underline;">Register</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
