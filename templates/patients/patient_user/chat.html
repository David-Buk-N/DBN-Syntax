{% extends 'base.html' %}

{% block title %}AI & Therapist Chat - Mind Link{% endblock %}

{% block content %}
<section class="section" style="max-width: 700px; margin: 0 auto;">
    <div class="container">
        <div class="feature-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; box-shadow: 0 10px 30px var(--shadow); border-radius: 20px; padding: 2.5rem 2rem;">
            <h2 style="text-align:center; margin-bottom: 1.5rem;">Chat with AI or Therapist</h2>
            <div id="chat-window" style="background: var(--card-bg); color: #333; border-radius: 12px; padding: 1.5rem; min-height: 250px; max-height: 350px; overflow-y: auto; margin-bottom: 1.5rem; box-shadow: 0 2px 8px var(--shadow);">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chat-form" style="display: flex; gap: 1rem;">
                <input type="text" id="chat-input" name="message" placeholder="Type your message..." autocomplete="off" style="flex: 1; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
                <button type="submit" style="background: var(--primary-color); color: white; padding: 0.8rem 1.2rem; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.3s ease;">Send</button>
            </form>
            <div style="margin-top: 2rem; text-align: center;">
                <a href="#" id="video-call-btn" style="background: #43e97b; color: white; padding: 0.7rem 1.5rem; border-radius: 25px; font-weight: bold; text-decoration: none; font-size: 1rem; transition: all 0.3s ease;">Start Video Call with Therapist</a>
            </div>
        </div>
    </div>
</section>
<script>
    // Simple chat UI logic (replace with backend integration for real AI/therapist chat)
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = chatInput.value.trim();
        if (!msg) return;
        appendMessage('You', msg);
        chatInput.value = '';
        // Simulate AI response (replace with backend call)
        setTimeout(() => {
            appendMessage('AI', 'This is an AI response. (Integrate Gemini or therapist backend here)');
        }, 900);
    });
    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.style.marginBottom = '1rem';
        msgDiv.innerHTML = `<strong>${sender}:</strong> <span>${text}</span>`;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
    // Video call button (placeholder)
    document.getElementById('video-call-btn').onclick = function(e) {
        e.preventDefault();
        alert('Video call feature coming soon!');
    };
</script>
{% endblock %}
